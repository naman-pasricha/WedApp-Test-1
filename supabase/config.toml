# Supabase Local Development Config
project_id = "wedapp"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.send-push]
verify_jwt = true
import_map = "supabase/functions/import_map.json"

[functions.generate-zip]
verify_jwt = true
import_map = "supabase/functions/import_map.json"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
max_frequency = "1s"

[auth.sms]
enable_signup = true
max_frequency = "5s"
template = "Your code is {{ .Code }} ."

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = ""

[auth.external.github]
enabled = false
client_id = ""
secret = ""
skip_nonce_check = false

[inbucket]
enabled = true
port = 54324

[analytics]
enabled = true
port = 54327
backend = "postgres"