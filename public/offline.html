<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - WedApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFF8F3;
      color: #3D3D3D;
      padding: 20px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #C4785E, #D4A574);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 1.75rem; margin-bottom: 12px; }
    p { color: #8B7D6B; max-width: 300px; margin-bottom: 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #C4785E; color: white; border: none;
      padding: 14px 28px; border-radius: 9999px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: background 0.2s;
    }
    .btn:hover { background: #B06850; }
  </style>
</head>
<body>
  <div class="icon">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>Don't worry! Your photos and messages will sync when you're back online.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
  <script>
    // Auto-retry when online
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
